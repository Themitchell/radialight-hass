[project]
name = "radialight-hass"
version = "0.2.0"
description = "Home Assistant integration for Radialight ICON radiators"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "aiohttp>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
